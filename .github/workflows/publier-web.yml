# Publie la version SAFe (branche claude/version-safe) sur GitHub Pages à chaque modification :
# https://tmarmed.github.io/Default/safe/ (et la démo : https://tmarmed.github.io/Default/demo/) ; l'adresse racine https://tmarmed.github.io/Default/ y renvoie.
# La version simple (branche claude/mobile-task-management-app-q8jysq) n'est plus publiée.
name: Publier la version web

on:
  push:
    branches: [claude/mobile-task-management-app-q8jysq, claude/version-safe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub Pages n'accepte que la branche d'origine : un envoi sur la version SAFe relance la publication
  # depuis la branche d'origine (qui compile et publie la version SAFe).
  relancer:
    if: github.ref_name == 'claude/version-safe'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run publier-web.yml --repo ${{ github.repository }} --ref claude/mobile-task-management-app-q8jysq
        env:
          GH_TOKEN: ${{ github.token }}

  compiler:
    if: github.ref_name != 'claude/version-safe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/version-safe
          path: safe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: safe/mobile/package-lock.json
      - name: Compiler la version SAFe
        working-directory: safe/mobile
        run: |
          # Version affichée dans l'application (menu du compte, écran de connexion) : commit publié
          export EXPO_PUBLIC_VERSION="$(git rev-parse --short HEAD) · $(TZ=Europe/Paris date '+%d/%m %H:%M')"
          npm ci && npx tsc --noEmit && npm run verif:alertes && npm run verif:sheets && npm run verif:stockage && npx expo export --platform web --clear
          # Démo (données dans le navigateur, sans compte Google) : https://tmarmed.github.io/Default/demo/
          EXPO_PUBLIC_DEMO=1 EXPO_BASE_URL=/${{ github.event.repository.name }}/demo npx expo export --platform web --clear --output-dir dist-demo
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}/safe
      - name: Assembler le site
        run: |
          mkdir -p site/safe site/demo
          cp -r safe/mobile/dist/. site/safe/
          cp -r safe/mobile/dist-demo/. site/demo/
          # Adresse racine : renvoie vers la version SAFe
          printf '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=safe/"><title>President</title></head><body><a href="safe/">President</a></body></html>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: compiler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
