# Compile les deux versions web et les publie ensemble sur GitHub Pages à chaque modification de l'une d'elles.
# - Version simple (branche claude/mobile-task-management-app-q8jysq) : https://tmarmed.github.io/Default/
# - Version SAFe (branche claude/version-safe) : https://tmarmed.github.io/Default/safe/
name: Publier la version web

on:
  push:
    branches: [claude/mobile-task-management-app-q8jysq, claude/version-safe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub Pages n'accepte que la branche d'origine : un envoi sur la version SAFe relance la publication
  # depuis la branche d'origine (qui compile et publie les deux versions).
  relancer:
    if: github.ref_name == 'claude/version-safe'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run publier-web.yml --repo ${{ github.repository }} --ref claude/mobile-task-management-app-q8jysq
        env:
          GH_TOKEN: ${{ github.token }}

  compiler:
    if: github.ref_name != 'claude/version-safe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/mobile-task-management-app-q8jysq
          path: simple
      - uses: actions/checkout@v4
        with:
          ref: claude/version-safe
          path: safe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            simple/mobile/package-lock.json
            safe/mobile/package-lock.json
      - name: Compiler la version simple
        working-directory: simple/mobile
        run: npm ci && npx tsc --noEmit && npx expo export --platform web --clear
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: Compiler la version SAFe
        working-directory: safe/mobile
        run: npm ci && npx tsc --noEmit && npm run verif:alertes && npm run verif:sheets && npx expo export --platform web --clear
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}/safe
      - name: Assembler le site
        run: |
          mkdir -p site/safe
          cp -r simple/mobile/dist/. site/
          cp -r safe/mobile/dist/. site/safe/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: compiler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
