# Publie la version SAFe (branche claude/version-safe) sur GitHub Pages à chaque modification :
# https://tmarmed.github.io/Default/safe/ : seul lien publié (la démo s'y allume par l'interrupteur « Démo »).
# La version simple (branche claude/mobile-task-management-app-q8jysq) n'est plus publiée.
name: Publier la version web

# Publication arrêtée (07/10) : l'application n'est plus publiée à chaque envoi (dépôt privé, pas de livraison
# pour l'instant). Pour republier : remettre le déclencheur « push » ci-dessous, ou lancer à la main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub Pages n'accepte que la branche d'origine : un envoi sur la version SAFe relance la publication
  # depuis la branche d'origine (qui compile et publie la version SAFe).
  relancer:
    if: github.ref_name == 'claude/version-safe'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run publier-web.yml --repo ${{ github.repository }} --ref claude/mobile-task-management-app-q8jysq
        env:
          GH_TOKEN: ${{ github.token }}

  compiler:
    if: github.ref_name != 'claude/version-safe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/version-safe
          path: safe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: safe/mobile/package-lock.json
      - name: Compiler la version SAFe
        working-directory: safe/mobile
        run: |
          # Version affichée dans l'application (menu du compte, écran de connexion) : commit publié
          export EXPO_PUBLIC_VERSION="$(git rev-parse --short HEAD) · $(TZ=Europe/Paris date '+%d/%m %H:%M')"
          npm ci && npx tsc --noEmit && npm run verif:alertes && npm run verif:sheets && npm run verif:stockage && npm run verif:organisation && npx expo export --platform web --clear
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}/safe
      - name: Assembler le site
        run: |
          mkdir -p site/safe
          cp -r safe/mobile/dist/. site/safe/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: compiler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
