<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>President · barre du haut</title>
<style>
  :root { --fond:#EEF1F6; --carte:#fff; --texte:#18202C; --doux:#6B7686; --trait:#E1E6ED; --trait2:#EEF1F5; --bleu:#1A73E8; --bleuPale:#E8F0FE; --rouge:#D93025; --seg:#E6EAF0; --safe:#7B2FBF; }
  * { box-sizing:border-box; }
  body { margin:0; background:linear-gradient(180deg,#E3E8F0,#D6DDE8); font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color:var(--texte); min-height:100vh; }
  button { font:inherit; color:inherit; cursor:pointer; }
  h1 { font-size:19px; text-align:center; margin:20px 16px 4px; }
  h1 .reco { display:inline-block; background:#FFF4CC; color:#7A5A00; border:1px solid #F2D675; border-radius:10px; padding:2px 9px; font-size:14px; vertical-align:middle; margin-left:6px; }
  p.intro { text-align:center; color:var(--doux); font-size:14px; margin:0 auto 12px; max-width:640px; padding:0 16px; line-height:1.45; }
  .choix { display:flex; justify-content:center; gap:6px; margin:0 16px 16px; flex-wrap:wrap; }
  .choix button { border:1px solid #C9D2DE; background:#fff; border-radius:18px; padding:7px 14px; font-size:13px; font-weight:700; color:var(--doux); }
  .choix button.on { background:var(--texte); border-color:var(--texte); color:#fff; }
  .choix button .etoile { color:#E0A800; }
  .scene { display:flex; justify-content:center; gap:22px; flex-wrap:wrap; padding:0 12px 20px; }
  .col h2 { font-size:14px; text-align:center; margin:0 0 8px; color:#3A4556; }
  .tel { width:375px; max-width:calc(100vw - 24px); height:470px; background:var(--fond); border-radius:30px; overflow:hidden; box-shadow:0 0 0 7px #1B2230, 0 18px 44px rgba(24,32,44,.3); }
  .notes { max-width:640px; margin:0 auto 34px; padding:0 16px; font-size:13.5px; line-height:1.55; color:#3A4556; }

  /* Barre du haut : 3 variantes */
  .barre { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; padding:12px 12px 8px; min-height:52px; }
  .barre > .mode { justify-self:center; }
  .marque { font-weight:800; font-size:16px; letter-spacing:-.2px; white-space:nowrap; }
  .fin { display:flex; justify-content:flex-end; align-items:center; gap:6px; }
  .mode { display:flex; background:var(--seg); border-radius:15px; padding:2px; }
  .mode button { border:0; background:none; border-radius:13px; padding:5px 10px; font-size:12.5px; font-weight:800; color:var(--doux); }
  .mode button.on { background:#fff; color:var(--texte); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .mode button.on.s { background:var(--safe); color:#fff; }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--bleu); color:#fff; font-weight:800; display:grid; place-items:center; font-size:14px; border:0; flex:none; }
  .esp { flex:none; display:flex; align-items:center; gap:3px; height:32px; padding:0 7px; border-radius:16px; border:1px solid var(--trait); background:#fff; font-size:13px; white-space:nowrap; transition:all .2s; }
  .esp .n { font-size:11px; font-weight:800; min-width:18px; height:18px; border-radius:9px; display:grid; place-items:center; background:var(--texte); color:#fff; padding:0 4px; }
  .esp .ch { font-size:10px; color:var(--doux); transition:transform .2s; }
  .esp.ouvert { background:var(--texte); border-color:var(--texte); color:#fff; }
  .esp.ouvert .n { background:#fff; color:var(--texte); }
  .esp.ouvert .ch { color:#fff; transform:rotate(180deg); }
  /* 2 : capsule d'outils */
  .capsule { display:flex; align-items:center; gap:3px; background:#fff; border:1px solid var(--trait); border-radius:20px; padding:3px; box-shadow:0 1px 4px rgba(24,32,44,.06); }
  .capsule .mode { background:var(--seg); }
  .capsule .mode button { padding:4px 8px; font-size:12px; }
  .capsule .esp { border:0; height:30px; background:var(--gris, #F4F6FA); }
  .capsule .avatar { width:30px; height:30px; }
  .capsule .esp.ouvert { background:var(--texte); color:#fff; }
  .barre.v2 { grid-template-columns:auto 1fr; }
  /* 3 : logo court, espacement régulier */
  .barre.v3 { display:flex; justify-content:space-between; }
  .logo { width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,#2B82F0,#1A63D0); color:#fff; font-weight:900; font-size:16px; display:grid; place-items:center; flex:none; }
  .esp.v3 { width:auto; }

  /* Bloc Espaces */
  .bloc { margin:0 12px; background:var(--carte); border:1px solid var(--trait); border-radius:16px; }
  .bloc1 { padding:9px 10px 10px; margin-bottom:8px; animation:ouvre .2s ease-out; }
  @keyframes ouvre { from { opacity:0; transform:translateY(-6px); } }
  .tete { display:flex; align-items:center; gap:8px; margin:0 2px 9px; }
  .lab { font-size:11px; font-weight:800; color:var(--doux); letter-spacing:.7px; }
  .types { display:flex; background:var(--seg); border-radius:13px; padding:2px; }
  .types span { padding:3px 8px; border-radius:11px; font-size:11.5px; font-weight:800; color:var(--doux); }
  .types span.on { background:#fff; color:var(--texte); }
  .pm { margin-left:auto; display:flex; border:1px solid var(--trait); border-radius:15px; height:30px; overflow:hidden; }
  .pm span { padding:0 10px; display:grid; place-items:center; font-weight:800; font-size:16px; }
  .pm span:first-child { color:var(--bleu); border-right:1px solid var(--trait2); }
  .pm span:last-child { color:var(--rouge); }
  .puces { display:flex; gap:6px; overflow:hidden; -webkit-mask-image:linear-gradient(90deg,#000 85%,transparent); mask-image:linear-gradient(90deg,#000 85%,transparent); }
  .puce { flex:none; border:1px solid var(--trait); background:#fff; border-radius:16px; padding:6px 11px; font-size:13px; font-weight:650; }
  .puce.noir { background:var(--texte); border-color:var(--texte); color:#fff; }

  /* Début du bloc de l'écran */
  .bloc2 { padding:12px 12px 0; height:100%; }
  .titre { font-size:20px; font-weight:800; }
  .titre small { font-size:13px; color:var(--doux); font-weight:650; }
  .filtres { margin-top:10px; background:#F4F6FA; border:1px solid var(--trait2); border-radius:14px; padding:9px; }
  .ligne { display:flex; gap:6px; align-items:center; }
  .ligne + .ligne { margin-top:8px; }
  .rond { width:30px; height:30px; border-radius:15px; border:1px solid var(--trait); background:#fff; display:grid; place-items:center; font-size:12px; }
  .pp { border:1px solid var(--trait); background:#fff; border-radius:16px; padding:5px 10px; font-size:12px; font-weight:650; }
  .pp.bleu { background:var(--bleu); border-color:var(--bleu); color:#fff; }
  .seg { display:flex; background:var(--seg); border-radius:10px; padding:2px; margin-top:10px; }
  .seg span { flex:1; text-align:center; padding:6px 0; font-size:13px; font-weight:650; color:var(--doux); border-radius:8px; }
  .seg span.on { background:#fff; color:var(--texte); }
  .item { padding:11px 2px; border-bottom:1px solid var(--trait2); font-size:14px; font-weight:650; }
  .item small { display:block; color:var(--doux); font-weight:500; font-size:12px; margin-top:2px; }
</style>
</head>
<body>
<h1>Barre du haut avec la pastille des espaces <span class="reco">⭐ Recommandé : 1</span></h1>
<p class="intro">Chaque proposition est montrée <b>espaces repliés</b> (à gauche) et <b>dépliés</b> (à droite). Touche Simple / SAFe pour essayer.</p>
<div class="choix" id="choix">
  <button data-v="1" class="on"><span class="etoile">⭐</span> 1 · Pastille toujours là (recommandé)</button>
  <button data-v="2">2 · Capsule d'outils</button>
  <button data-v="3">3 · Logo court</button>
</div>
<div class="scene" id="scene"></div>
<div class="notes" id="notes"></div>

<script>
const ESP = [['🔒','Moi',true],['👥','Mobile',true],['🏢','ACME',false],['👥','Marketing',false]];
const st = { v:'1', safe:false };
const NOTES = {
  1: `<b>⭐ 1 · Pastille toujours là (recommandé)</b> — La barre ne change jamais : « President » à gauche, Simple | SAFe au centre, et à droite la pastille des espaces puis le compte. La pastille est aussi le bouton pour replier / déplier (plus de ▾ dans le bloc) : blanche « 🔒👥 ② ▾ » quand le bloc est replié, noire « ▴ » quand il est ouvert. Rien ne bouge, rien ne saute : c'est propre dans les deux cas.`,
  2: `<b>2 · Capsule d'outils</b> — « President » à gauche ; à droite une seule capsule blanche regroupe Simple | SAFe, la pastille des espaces et le compte. Très rangé, mais le mode n'est plus au centre et la capsule est chargée sur un petit écran.`,
  3: `<b>3 · Logo court</b> — « President » devient un petit logo « P » ; logo, mode, pastille et compte sont espacés régulièrement sur toute la largeur. Le plus aéré sur petit écran, mais on perd le nom écrit.`,
};
function barre(ouvert) {
  const vis = ESP.filter((e) => e[2]);
  const pastille = `<button class="esp ${ouvert ? 'ouvert' : ''}" data-plier>${vis.map((e) => e[0]).join('')}<span class="n">${vis.length}</span><span class="ch">▾</span></button>`;
  const mode = `<div class="mode"><button class="${st.safe ? '' : 'on'}" data-mode="0">Simple</button><button class="${st.safe ? 'on s' : ''}" data-mode="1">SAFe</button></div>`;
  const avatar = `<button class="avatar">T</button>`;
  if (st.v === '1') return `<div class="barre"><div class="marque">President</div>${mode}<div class="fin">${pastille}${avatar}</div></div>`;
  if (st.v === '2') return `<div class="barre v2"><div class="marque">President</div><div class="fin"><div class="capsule">${mode}${pastille}${avatar}</div></div></div>`;
  return `<div class="barre v3"><div class="logo">P</div>${mode}${pastille}${avatar}</div>`;
}
function bloc() {
  return `<div class="bloc bloc1"><div class="tete"><span class="lab">ESPACES</span><div class="types"><span class="on">Tous</span><span>👥</span><span>🏢</span></div><div class="pm"><span>＋</span><span>−</span></div></div>
    <div class="puces">${ESP.map((e) => `<span class="puce ${e[2] ? 'noir' : ''}">${e[0]} ${e[1]}</span>`).join('')}</div></div>`;
}
function ecran() {
  return `<div class="bloc bloc2"><div class="titre">✓ Mes tâches <small>· 27</small></div>
    <div class="filtres"><div class="ligne"><span class="lab">FILTRES</span><span class="rond">🔍</span><span class="rond">↺</span><span class="rond" style="margin-left:auto">▾</span></div>
    <div class="ligne"><span class="pp bleu">Tous</span><span class="pp">Type ▾</span></div><div class="ligne"><span class="pp bleu">Tous domaines</span><span class="pp">💼 Pro</span><span class="pp">🌿 Perso</span></div></div>
    <div class="seg"><span class="on">Liste</span><span>Jour</span><span>Semaine</span><span>Mois</span></div>
    <div class="item">Payer le loyer<small>🔒 Moi · 🌿 Perso · en retard</small></div>
    <div class="item">Appeler le fournisseur<small>🔒 Moi · 💼 Pro · 09:00</small></div>
    <div class="item">Maquette de la page contact<small>👥 Mobile · 💼 Pro</small></div></div>`;
}
function tel(ouvert) {
  return `<div class="tel" data-ouvert="${ouvert}">${barre(ouvert)}${ouvert ? bloc() : ''}${ecran()}</div>`;
}
function rendre() {
  document.getElementById('scene').innerHTML = `<div class="col"><h2>Espaces repliés</h2>${tel(false)}</div><div class="col"><h2>Espaces dépliés</h2>${tel(true)}</div>`;
  document.getElementById('notes').innerHTML = NOTES[st.v];
  document.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => { st.safe = b.dataset.mode === '1'; rendre(); }));
}
document.querySelectorAll('#choix button').forEach((b) => (b.onclick = () => {
  st.v = b.dataset.v;
  document.querySelectorAll('#choix button').forEach((x) => x.classList.toggle('on', x === b));
  rendre();
}));
rendre();
</script>
</body>
</html>
