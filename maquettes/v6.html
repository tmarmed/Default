<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>President · maquette v6</title>
<style>
  :root {
    --fond:#EEF1F6; --carte:#fff; --texte:#18202C; --doux:#6B7686; --trait:#E1E6ED; --trait2:#EEF1F5;
    --bleu:#1A73E8; --bleuPale:#E8F0FE; --safe:#7B2FBF; --safePale:#F3EAFB; --gris:#F4F6FA; --seg:#E6EAF0;
    --ombre:0 1px 2px rgba(24,32,44,.05), 0 4px 14px rgba(24,32,44,.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:linear-gradient(180deg,#E3E8F0,#D6DDE8); font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color:var(--texte); min-height:100vh; }
  button { font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  h1.page { font-size:20px; text-align:center; margin:22px 16px 4px; letter-spacing:-.2px; }
  p.intro { text-align:center; color:var(--doux); font-size:14px; margin:0 auto 14px; max-width:620px; padding:0 16px; line-height:1.45; }
  .choix { display:flex; justify-content:center; gap:6px; margin:0 16px 16px; flex-wrap:wrap; }
  .choix button { border:1px solid #C9D2DE; background:#fff; border-radius:18px; padding:7px 14px; font-size:13px; font-weight:700; color:var(--doux); }
  .choix button.on { background:var(--texte); border-color:var(--texte); color:#fff; }
  .scene { display:flex; justify-content:center; gap:28px; flex-wrap:wrap; padding:0 16px 36px; }
  .notes { width:330px; max-width:100%; font-size:13.5px; line-height:1.55; color:#3A4556; }
  .notes h3 { font-size:14px; margin:0 0 6px; color:var(--texte); }
  .notes ul { margin:0 0 14px; padding-left:18px; }
  .notes li { margin-bottom:4px; }

  /* ----- Téléphone ----- */
  .tel { position:relative; width:375px; max-width:100%; height:760px; background:var(--fond); border-radius:34px; overflow:hidden; box-shadow:0 0 0 8px #1B2230, 0 24px 60px rgba(24,32,44,.35); display:flex; flex-direction:column; }
  .statut { flex:none; height:26px; display:flex; justify-content:space-between; align-items:center; padding:0 24px; font-size:12px; font-weight:700; }
  .appbar { flex:none; display:flex; align-items:center; justify-content:space-between; padding:4px 16px 8px; }
  .marque { font-weight:800; font-size:16px; letter-spacing:-.2px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--bleu); color:#fff; font-weight:700; display:grid; place-items:center; font-size:14px; box-shadow:0 2px 6px rgba(26,115,232,.35); }

  .bloc { margin:0 12px; background:var(--carte); border-radius:18px; box-shadow:var(--ombre); }
  .bloc1 { flex:none; padding:10px 12px 11px; }
  .bloc2 { flex:1; min-height:0; margin-top:8px; margin-bottom:10px; display:flex; flex-direction:column; overflow:hidden; }
  .entete { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .lab { font-size:11px; font-weight:800; color:var(--doux); letter-spacing:.7px; text-transform:uppercase; }
  .petitBtn { border:1px solid var(--trait); background:#fff; border-radius:13px; min-width:30px; height:26px; padding:0 9px; font-size:14px; font-weight:800; display:grid; place-items:center; }
  .petitBtn.bleu { color:var(--bleu); }
  .puces { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-right:36px; -webkit-mask-image:linear-gradient(90deg,#000 86%,transparent); mask-image:linear-gradient(90deg,#000 86%,transparent); }
  .puces::-webkit-scrollbar { display:none; }
  .puce { flex:none; max-width:160px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border:1px solid var(--trait); background:#fff; border-radius:17px; padding:6px 11px; font-size:13px; font-weight:650; transition:background .15s, color .15s; }
  .puce.noir { background:var(--texte); border-color:var(--texte); color:#fff; }
  .bloc1 .puces { margin-top:9px; }

  /* Bloc 2 : titre */
  .titre2 { flex:none; display:flex; align-items:baseline; gap:6px; padding:12px 14px 8px; }
  .titre2 b { font-size:20px; font-weight:800; letter-spacing:-.3px; }
  .titre2 .nb { font-size:13px; color:var(--doux); font-weight:650; }
  .titre2 .tagSafe { margin-left:auto; align-self:center; font-size:11px; font-weight:800; color:var(--safe); background:var(--safePale); border-radius:8px; padding:2px 7px; }

  /* Sous-bloc : recherche et filtres */
  .filtres { flex:none; margin:0 10px 10px; background:var(--gris); border:1px solid var(--trait2); border-radius:14px; padding:9px 9px 10px; }
  .filtres .entete { margin:0 2px 8px; }
  .filtres .lab { white-space:nowrap; }
  .filtres .entete .droite { display:flex; gap:10px; align-items:center; }
  .lienBleu { border:0; background:none; padding:0; font-size:12px; font-weight:700; color:var(--bleu); }
  .compte { background:var(--bleu); color:#fff; border-radius:9px; font-size:10.5px; font-weight:800; padding:1px 6px; margin-left:4px; letter-spacing:0; }
  .chevron { border:0; background:none; padding:0 2px; font-size:13px; color:var(--doux); transition:transform .2s; }
  .ferme .chevron { transform:rotate(-90deg); }
  .corps { display:flex; flex-direction:column; gap:8px; }
  .ferme .corps { display:none; }
  .resume { display:none; font-size:12.5px; color:var(--doux); margin:0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ferme .resume { display:block; }
  .ferme .entete { margin-bottom:4px; }
  .seg { display:flex; background:var(--seg); border-radius:10px; padding:2px; position:relative; }
  .seg button { flex:1; border:0; background:none; padding:6px 0; border-radius:8px; font-size:13px; font-weight:650; color:var(--doux); position:relative; z-index:1; transition:color .15s; }
  .seg button.on { color:var(--texte); }
  .seg .curseur { position:absolute; top:2px; bottom:2px; border-radius:8px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.1); transition:left .2s, width .2s; }
  .filtres .puce { font-size:12px; padding:5px 10px; max-width:none; }
  .puce.bleu { background:var(--bleu); border-color:var(--bleu); color:#fff; }
  .puce.violet { background:var(--safePale); border-color:#DCC4F2; color:var(--safe); }
  .puce.violet.actif { background:var(--safe); border-color:var(--safe); color:#fff; }
  .puce.ajout { border-style:dashed; color:var(--bleu); background:transparent; }
  .rangee { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .champ { display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--bleu); border-radius:11px; padding:0 6px 0 10px; height:36px; box-shadow:0 0 0 3px rgba(26,115,232,.12); animation:entre .18s ease-out; }
  .champ input { flex:1; min-width:0; border:0; outline:0; font:inherit; font-size:14px; background:none; color:var(--texte); }
  .champ .x { border:0; background:var(--seg); width:22px; height:22px; border-radius:50%; font-size:11px; color:var(--doux); }
  @keyframes entre { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
  .menuAjout { position:absolute; z-index:10; background:#fff; border:1px solid var(--trait); border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,.16); padding:4px; width:220px; }
  .menuAjout button { display:flex; gap:10px; align-items:center; width:100%; text-align:left; border:0; background:none; border-radius:8px; padding:8px 10px; font-size:13px; font-weight:650; }
  .menuAjout button:hover { background:var(--gris); }
  .menuAjout button small { display:block; font-size:11px; color:var(--doux); font-weight:500; }
  .menuAjout button[disabled] { opacity:.4; cursor:default; }

  /* Liste */
  .liste { flex:1; overflow-y:auto; border-top:1px solid var(--trait2); padding-bottom:84px; }
  .alerte { display:flex; justify-content:space-between; margin:10px 10px 2px; border-radius:11px; padding:8px 11px; font-size:13px; font-weight:750; background:#FDEEEE; color:#C62828; }
  .section { font-size:11px; font-weight:800; letter-spacing:.7px; text-transform:uppercase; color:var(--doux); padding:12px 14px 4px; }
  .section.retard { color:#C62828; }
  .item { display:flex; gap:11px; align-items:flex-start; padding:10px 14px; border-top:1px solid var(--trait2); }
  .section + .item { border-top:0; }
  .rond { flex:none; width:20px; height:20px; border-radius:50%; border:2px solid #A5AEBB; margin-top:1px; }
  .item .t { font-size:14.5px; font-weight:650; }
  .item .t mark { background:#FFF1A8; border-radius:3px; padding:0 1px; }
  .item small { display:block; color:var(--doux); font-size:12px; margin-top:2px; }
  .badge { white-space:nowrap; font-size:11px; font-weight:750; color:var(--safe); background:var(--safePale); border-radius:6px; padding:1px 5px; }
  .vide { text-align:center; color:var(--doux); font-size:13px; padding:36px 20px; }

  /* ----- Bas de l'écran : 3 variantes ----- */
  .bas { flex:none; position:relative; }
  .fab { position:absolute; right:22px; width:54px; height:54px; border-radius:50%; background:var(--bleu); color:#fff; font-size:30px; display:grid; place-items:center; box-shadow:0 6px 16px rgba(26,115,232,.45); border:0; z-index:4; }
  .onglet { flex:1 0 64px; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10.5px; font-weight:700; color:var(--doux); position:relative; transition:color .15s; }
  .onglet .ic { font-size:18px; line-height:20px; filter:grayscale(1); opacity:.75; transition:filter .15s, opacity .15s; }
  .onglet.on { color:var(--bleu); }
  .onglet.on .ic { filter:none; opacity:1; }
  .onglet .pastille { position:absolute; top:3px; left:calc(50% + 5px); background:#E53935; color:#fff; font-size:9px; font-weight:800; border-radius:8px; padding:0 4px; border:1.5px solid #fff; }
  .onglets { display:flex; overflow-x:auto; scrollbar-width:none; }
  .onglets::-webkit-scrollbar { display:none; }

  /* A · Tiroir : mode en pastille glissante au-dessus des onglets */
  .varA { background:#fff; border-top-left-radius:22px; border-top-right-radius:22px; box-shadow:0 -4px 20px rgba(24,32,44,.08); padding-top:8px; }
  .modeGlisse { display:flex; justify-content:center; }
  .modeGlisse .seg { width:180px; border-radius:15px; }
  .modeGlisse .seg button { padding:4px 0; font-size:12px; font-weight:800; }
  .modeGlisse .seg button.on.s { color:var(--safe); }
  .varA .onglets { height:56px; }
  .varA .onglet.on::before { content:""; position:absolute; bottom:5px; width:5px; height:5px; border-radius:50%; background:var(--bleu); }

  /* B · Dock flottant + bouton de mode rond à gauche */
  .varB { display:flex; gap:8px; align-items:center; padding:0 12px 14px; }
  .modeRond { flex:none; width:58px; height:58px; border-radius:20px; border:0; background:#fff; box-shadow:0 6px 18px rgba(24,32,44,.14); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:10.5px; font-weight:800; color:var(--doux); transition:background .2s, color .2s; }
  .modeRond .ic { font-size:18px; line-height:20px; }
  .modeRond.on { background:var(--safe); color:#fff; box-shadow:0 6px 18px rgba(123,47,191,.4); }
  .dock { flex:1; min-width:0; height:58px; background:rgba(255,255,255,.96); border-radius:20px; box-shadow:0 6px 18px rgba(24,32,44,.14); overflow:hidden; }
  .dock .onglets { height:100%; padding:0 4px; }
  .dock .onglet { flex:1 0 56px; }
  .dock .onglet.on { color:var(--bleu); }
  .dock .onglet.on::after { content:""; position:absolute; inset:6px 4px; border-radius:14px; background:var(--bleuPale); z-index:-1; }
  .dock .onglet { z-index:0; }

  /* C · Barre classique, mode en onglet « Affichage » */
  .varC { background:#fff; border-top:1px solid var(--trait); height:60px; display:flex; }
  .varC .onglets { flex:1; min-width:0; }
  .varC .onglet.on::before { content:""; position:absolute; top:0; left:16px; right:16px; height:3px; border-radius:0 0 3px 3px; background:var(--bleu); }
  .ongletMode { flex:none; width:70px; border:0; border-left:1px solid var(--trait2); background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10.5px; font-weight:800; color:var(--doux); }
  .ongletMode .puceMode { font-size:11px; font-weight:800; border-radius:8px; padding:2px 7px; background:var(--seg); color:var(--doux); transition:background .2s, color .2s; }
  .ongletMode.on .puceMode { background:var(--safe); color:#fff; }

  .toast { position:absolute; left:50%; transform:translateX(-50%) translateY(6px); bottom:100%; margin-bottom:10px; background:rgba(24,32,44,.92); color:#fff; font-size:12px; font-weight:600; padding:7px 13px; border-radius:16px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; white-space:nowrap; z-index:6; }
  .toast.vu { opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
<h1 class="page">Maquette v6 : un sous-bloc « Recherche et filtres », le mode en bas</h1>
<p class="intro">Tout se clique : espaces, vues, types, domaines, « ＋ Filtre » (la recherche filtre vraiment la liste), onglets et mode. Choisis ci-dessous la forme du bas de l'écran.</p>
<div class="choix" id="choix">
  <button data-var="A" class="on">A · Tiroir</button>
  <button data-var="B">B · Dock flottant</button>
  <button data-var="C">C · Barre classique</button>
</div>

<div class="scene">
  <div class="tel" id="tel"></div>
  <div class="notes" id="notes"></div>
</div>

<script>
const ECRANS = {
  taches:['✓','Tâches','Mes tâches'], iteration:['🏃','Itération','Itération'], pi:['📅','PI','PI'],
  strategie:['🎯','Stratégie','Stratégie'], backlog:['📥','Backlog','Backlog'], portefeuille:['💼','Portef.','Portefeuille'],
  roadmap:['🗺️','Roadmap','Roadmap'], equipe:['👥','Équipe','Équipe'], pilotage:['📊','Pilotage','Pilotage'],
};
const ONGLETS = { simple:['taches','roadmap','equipe','pilotage'], safe:['taches','iteration','pi','strategie','backlog','portefeuille','roadmap','equipe','pilotage'] };
const ESPACES = [['moi','🔒 Moi'],['mobile','👥 Mobile'],['acme','🏢 ACME'],['mkt','👥 Marketing digital Europe du Sud']];
const DOMAINES = [['pro','💼 Pro'],['perso','🌿 Perso'],['famille','👪 Famille'],['loisirs','🎨 Loisirs']];
const TYPES = [['tous','Tous'],['tache','✓ Tâches'],['rdv','📅 Rendez-vous'],['appel','📞 Appels'],['mission','🚩 Missions']];
const VUES = ['Liste','Jour','Semaine','Mois'];
// section : 0 en retard, 1 aujourd'hui, 2 cette semaine, 3 ce mois
const ITEMS = [
  { t:'Payer le loyer', e:'moi', d:'perso', ty:'tache', s:0, info:'août 2026' },
  { t:'Chantier Martin', e:'moi', d:'pro', ty:'mission', s:0, info:'08:00 → 12:00 · Villeurbanne' },
  { t:'Appeler le fournisseur', e:'moi', d:'pro', ty:'appel', s:1, info:'09:00' },
  { t:'Maquette de la page contact', e:'mobile', d:'pro', ty:'tache', s:1, info:'Refonte du site web', feat:'🧩 Formulaire', pts:5, it:true },
  { t:'Rendez-vous dentiste', e:'moi', d:'perso', ty:'rdv', s:1, info:'🩺 Santé · 14:00' },
  { t:'Préparer la démo client', e:'mobile', d:'pro', ty:'tache', s:1, info:'🛠️ Travail', feat:'🧩 Démo', pts:3, it:true },
  { t:'Courses pour le week-end', e:'moi', d:'famille', ty:'tache', s:2, info:'samedi' },
  { t:'Relire le contrat ACME', e:'acme', d:'pro', ty:'tache', s:2, info:'vendredi', feat:'🧩 Juridique', pts:2 },
  { t:'Cours de guitare', e:'moi', d:'loisirs', ty:'rdv', s:2, info:'jeudi 19:00' },
  { t:'Bilan trimestriel', e:'mobile', d:'pro', ty:'tache', s:3, info:'le 28', feat:'🧩 Pilotage', pts:8 },
  { t:'Anniversaire de Léa', e:'moi', d:'famille', ty:'rdv', s:3, info:'le 30' },
];
const SECTIONS = [['En retard','retard'],["Aujourd'hui",''],['Cette semaine',''],['Ce mois-ci','']];
const NOM_ESP = Object.fromEntries(ESPACES), NOM_DOM = Object.fromEntries(DOMAINES);

const st = { variante:'A', safe:false, ecran:'taches', vue:0, type:'tous', dom:'', espaces:['moi','mobile'], iteration:false,
  recherche:null, menu:false, ferme:false, toast:'' };
const tel = document.getElementById('tel');

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const surligne = (t, q) => {
  if (!q) return esc(t);
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
};

function visibles() {
  const q = (st.recherche ?? '').trim().toLowerCase();
  const maxSection = [3, 1, 2, 3][st.vue];
  return ITEMS.filter((x) => st.espaces.includes(x.e)
    && (!st.dom || x.d === st.dom)
    && (st.type === 'tous' || x.ty === st.type)
    && (!st.safe || !st.iteration || x.it)
    && x.s <= maxSection
    && (!q || x.t.toLowerCase().includes(q)));
}

function nbActifs() {
  return (st.type !== 'tous') + !!st.dom + (st.safe && st.iteration) + !!(st.recherche && st.recherche.trim());
}

function seg(options, actif, attr) {
  return `<div class="seg" data-seg>${options.map((o, i) => `<button class="${i === actif ? 'on' : ''}" ${attr}="${i}">${o}</button>`).join('')}<span class="curseur"></span></div>`;
}

function filtres() {
  const taches = st.ecran === 'taches';
  const n = nbActifs();
  const resume = [taches ? VUES[st.vue] : null, taches ? (TYPES.find((t) => t[0] === st.type)[1]) : null, st.dom ? NOM_DOM[st.dom] : 'tous domaines', st.recherche ? `« ${st.recherche} »` : null].filter(Boolean).join(' · ');
  let h = `<div class="filtres ${st.ferme ? 'ferme' : ''}">
    <div class="entete"><span class="lab">🔍 Recherche et filtres${n ? `<span class="compte">${n}</span>` : ''}</span>
      <span class="droite">${n ? '<button class="lienBleu" data-reset>Effacer</button>' : ''}<button class="chevron" data-plier aria-label="Replier">▾</button></span></div>
    <div class="resume">${resume}</div>
    <div class="corps">`;
  if (st.recherche !== null) h += `<div class="champ">🔍<input id="q" placeholder="Rechercher un titre…" value="${esc(st.recherche)}"><button class="x" data-sansrecherche aria-label="Retirer la recherche">✕</button></div>`;
  if (taches) h += seg(VUES, st.vue, 'data-vue');
  if (taches) h += `<div class="puces">${TYPES.map(([k, l]) => `<button class="puce ${st.type === k ? 'bleu' : ''}" data-type="${k}">${l}</button>`).join('')}</div>`;
  h += `<div class="puces"><button class="puce ${!st.dom ? 'bleu' : ''}" data-dom="">Tous domaines</button>${DOMAINES.map(([k, l]) => `<button class="puce ${st.dom === k ? 'bleu' : ''}" data-dom="${k}">${l}</button>`).join('')}</div>`;
  h += `<div class="rangee">${st.safe && taches ? `<button class="puce violet ${st.iteration ? 'actif' : ''}" data-iteration>🏃 Itération en cours</button>` : ''}<button class="puce ajout" data-ajout>＋ Filtre</button></div>`;
  h += `</div></div>`;
  return h;
}

function liste() {
  if (st.ecran !== 'taches') {
    const [ic, , t] = ECRANS[st.ecran];
    return `<div class="vide">${ic} Contenu de l'écran ${t}<br><small>(mêmes blocs, mêmes filtres adaptés)</small></div>`;
  }
  const v = visibles();
  if (!v.length) return `<div class="vide">Aucun élément ne correspond.<br><button class="lienBleu" data-reset style="margin-top:8px">Réinitialiser les filtres</button></div>`;
  const q = (st.recherche ?? '').trim();
  let h = q || st.vue ? '' : `<div class="alerte"><span>⚠ 4 alertes</span><span>▸</span></div>`;
  SECTIONS.forEach(([nom, cls], i) => {
    const xs = v.filter((x) => x.s === i);
    if (!xs.length) return;
    h += `<div class="section ${cls}">${nom} · ${xs.length}</div>`;
    h += xs.map((x) => `<div class="item"><span class="rond"></span><div><div class="t">${surligne(x.t, q)}</div><small>${NOM_ESP[x.e]} · ${NOM_DOM[x.d]} · ${x.info}${st.safe && x.feat ? ` · <span class="badge">${x.feat}</span> · ${x.pts} pts` : ''}</small></div></div>`).join('');
  });
  return h;
}

function bas() {
  const ong = ONGLETS[st.safe ? 'safe' : 'simple'];
  const onglets = `<div class="onglets">${ong.map((k) => `<button class="onglet ${k === st.ecran ? 'on' : ''}" data-ecran="${k}"><span class="ic">${ECRANS[k][0]}</span>${ECRANS[k][1]}${k === 'taches' ? '<span class="pastille">4</span>' : ''}</button>`).join('')}</div>`;
  const toast = `<div class="toast ${st.toast ? 'vu' : ''}">${st.toast}</div>`;
  if (st.variante === 'A') return `<div class="bas varA">${toast}<button class="fab" style="bottom:calc(100% + 12px)">+</button>
      <div class="modeGlisse"><div class="seg" data-seg><button class="${st.safe ? '' : 'on'}" data-mode="0">Simple</button><button class="${st.safe ? 'on s' : ''}" data-mode="1">SAFe</button><span class="curseur"></span></div></div>${onglets}</div>`;
  if (st.variante === 'B') return `<div class="bas varB">${toast}<button class="fab" style="bottom:calc(100% + 12px)">+</button>
      <button class="modeRond ${st.safe ? 'on' : ''}" data-bascule aria-pressed="${st.safe}"><span class="ic">${st.safe ? '◆' : '◇'}</span>${st.safe ? 'SAFe' : 'Simple'}</button>
      <div class="dock">${onglets}</div></div>`;
  return `<div class="bas varC">${toast}<button class="fab" style="bottom:calc(100% + 12px)">+</button>${onglets}
      <button class="ongletMode ${st.safe ? 'on' : ''}" data-bascule aria-pressed="${st.safe}"><span class="puceMode">${st.safe ? 'SAFe' : 'Simple'}</span>Mode</button></div>`;
}

const NOTES = {
  A: `<h3>A · Tiroir</h3><ul><li>Le bas de l'écran devient un tiroir blanc aux coins arrondis.</li><li>En haut du tiroir, un sélecteur <b>Simple | SAFe</b> centré, dont le curseur glisse ; SAFe s'écrit en violet.</li><li>Dessous, les onglets. L'onglet ouvert est marqué d'un point bleu.</li><li>C'est le plus lisible, mais il ajoute une fine ligne.</li></ul>`,
  B: `<h3>B · Dock flottant</h3><ul><li>Les onglets sont dans un dock blanc qui flotte au-dessus du bas de l'écran.</li><li>À gauche, un <b>bouton de mode</b> carré aux coins arrondis : blanc « ◇ Simple », qui devient violet « ◆ SAFe ».</li><li>L'onglet ouvert est posé sur une pastille bleu pâle.</li><li>C'est le plus moderne et le plus visuel.</li></ul>`,
  C: `<h3>C · Barre classique</h3><ul><li>C'est la barre d'aujourd'hui.</li><li>Le mode devient le dernier bouton, <b>« Mode »</b>, avec une étiquette grise « Simple » qui devient violette « SAFe ».</li><li>Il n'y a plus d'interrupteur.</li><li>C'est le plus sobre et le plus proche de l'existant.</li></ul>`,
};
const COMMUN = `<h3>Bloc 2 : sous-bloc « 🔍 Recherche et filtres »</h3><ul>
  <li>Tous les filtres sont dans un sous-cadre gris : vue (Liste, Jour, Semaine, Mois), types, domaines et, en SAFe, 🏃 Itération en cours.</li>
  <li><b>＋ Filtre</b> ajoute une <b>recherche</b> par titre. Elle filtre la liste en direct et surligne le mot. Le ✕ retire la recherche.</li>
  <li>Une pastille bleue compte les filtres actifs, et <b>Effacer</b> remet tout à zéro.</li>
  <li>▾ replie le sous-bloc en une ligne de résumé : la liste gagne de la place.</li>
  <li>Le titre de l'écran et le nombre d'éléments sont en haut du bloc. Seule la liste défile.</li></ul>`;

function rendre() {
  const ong = ONGLETS[st.safe ? 'safe' : 'simple'];
  if (!ong.includes(st.ecran)) st.ecran = 'taches';
  const [ic, , titre] = ECRANS[st.ecran];
  const nb = st.ecran === 'taches' ? visibles().length : null;
  const focus = document.activeElement?.id === 'q';
  tel.innerHTML = `
    <div class="statut"><span>9:41</span><span>●●● ◔</span></div>
    <div class="appbar"><div class="marque">President</div><div class="avatar">T</div></div>
    <div class="bloc bloc1">
      <div class="entete"><span class="lab">Espaces</span><span style="display:flex;gap:6px"><button class="petitBtn bleu">＋</button><button class="petitBtn">⋯</button></span></div>
      <div class="puces">${ESPACES.map(([k, l]) => `<button class="puce ${st.espaces.includes(k) ? 'noir' : ''}" data-esp="${k}">${l}</button>`).join('')}</div>
    </div>
    <div class="bloc bloc2">
      <div class="titre2"><b>${ic} ${titre}</b>${nb !== null ? `<span class="nb">· ${nb}</span>` : ''}${st.safe ? '<span class="tagSafe">SAFe</span>' : ''}</div>
      ${filtres()}
      <div class="liste">${liste()}</div>
    </div>
    ${bas()}`;
  // Curseurs des sélecteurs
  tel.querySelectorAll('[data-seg]').forEach((s) => {
    const on = s.querySelector('button.on'), c = s.querySelector('.curseur');
    if (on && c) { c.style.left = on.offsetLeft + 'px'; c.style.width = on.offsetWidth + 'px'; }
  });
  const q = tel.querySelector('#q');
  if (q) {
    q.oninput = () => { st.recherche = q.value; rendreGarde(); };
    if (focus || st.focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); st.focusQ = false; }
  }
  const on = (sel, f) => tel.querySelectorAll(sel).forEach((b) => (b.onclick = (e) => { f(b, e); rendre(); }));
  on('[data-esp]', (b) => { const k = b.dataset.esp; if (st.espaces.includes(k)) { if (st.espaces.length > 1) st.espaces = st.espaces.filter((x) => x !== k); } else st.espaces.push(k); });
  on('[data-vue]', (b) => (st.vue = +b.dataset.vue));
  on('[data-type]', (b) => (st.type = b.dataset.type));
  on('[data-dom]', (b) => (st.dom = b.dataset.dom));
  on('[data-iteration]', () => (st.iteration = !st.iteration));
  on('[data-ecran]', (b) => (st.ecran = b.dataset.ecran));
  on('[data-reset]', () => { st.type = 'tous'; st.dom = ''; st.iteration = false; st.recherche = null; st.vue = 0; });
  on('[data-plier]', () => (st.ferme = !st.ferme));
  on('[data-sansrecherche]', () => (st.recherche = null));
  on('[data-mode]', (b) => changerMode(b.dataset.mode === '1'));
  on('[data-bascule]', () => changerMode(!st.safe));
  const ajout = tel.querySelector('[data-ajout]');
  if (ajout) ajout.onclick = (e) => { e.stopPropagation(); ouvrirMenu(ajout); };
}
// Pendant la frappe : ne redessine que le compteur et la liste (le champ garde le curseur)
function rendreGarde() {
  const nb = tel.querySelector('.titre2 .nb');
  if (nb) nb.textContent = '· ' + visibles().length;
  tel.querySelector('.liste').innerHTML = liste();
  const c = tel.querySelector('.filtres .compte'), n = nbActifs();
  const lab = tel.querySelector('.filtres .lab');
  lab.innerHTML = `🔍 Recherche et filtres${n ? `<span class="compte">${n}</span>` : ''}`;
  tel.querySelectorAll('.liste [data-reset]').forEach((b) => (b.onclick = () => { st.type = 'tous'; st.dom = ''; st.iteration = false; st.recherche = null; st.vue = 0; rendre(); }));
}
function changerMode(safe) {
  if (safe === st.safe) return;
  st.safe = safe;
  st.toast = safe ? 'Mode SAFe : itérations, PI, features, points' : 'Mode Simple';
  clearTimeout(changerMode.t);
  changerMode.t = setTimeout(() => { st.toast = ''; tel.querySelector('.toast')?.classList.remove('vu'); }, 1600);
}
function ouvrirMenu(ancre) {
  fermerMenu();
  const m = document.createElement('div');
  m.className = 'menuAjout';
  m.innerHTML = `
    <button data-m="recherche" ${st.recherche !== null ? 'disabled' : ''}>🔍<span>Recherche<small>Par titre, en direct</small></span></button>
    <button disabled>📅<span>Échéance<small>Bientôt</small></span></button>
    <button disabled>🏷️<span>Statut<small>Bientôt</small></span></button>`;
  const r = ancre.getBoundingClientRect(), t = tel.getBoundingClientRect();
  m.style.left = Math.min(r.left - t.left, t.width - 232) + 'px';
  m.style.top = (r.bottom - t.top + 6) + 'px';
  tel.appendChild(m);
  m.querySelector('[data-m=recherche]').onclick = () => { st.recherche = ''; st.ferme = false; st.focusQ = true; fermerMenu(); rendre(); };
  setTimeout(() => document.addEventListener('click', fermerMenu, { once: true }));
}
function fermerMenu() { document.querySelectorAll('.menuAjout').forEach((m) => m.remove()); }

document.querySelectorAll('#choix button').forEach((b) => (b.onclick = () => {
  st.variante = b.dataset.var;
  document.querySelectorAll('#choix button').forEach((x) => x.classList.toggle('on', x === b));
  document.getElementById('notes').innerHTML = NOTES[st.variante] + COMMUN;
  rendre();
}));
document.getElementById('notes').innerHTML = NOTES.A + COMMUN;
rendre();
</script>
</body>
</html>
